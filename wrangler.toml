name = "bestdateweather-prod"
compatibility_date = "2026-03-26"
main = "worker-assets.js"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "bestdateweather.com/*"
zone_id = "cfedf1ce8a5d7df3a8be049a5653ba31"

[[routes]]
pattern = "www.bestdateweather.com/*"
zone_id = "cfedf1ce8a5d7df3a8be049a5653ba31"

[assets]
directory = "."
binding = "ASSETS"
# Les requêtes *.html doivent atteindre le worker AVANT la couche Assets.
# Sans cela, Cloudflare répond lui-même par un 307 TEMPORAIRE (comportement
# par défaut de html_handling="auto-trailing-slash"), ce qui empêche Google
# de consolider les signaux des anciennes URLs .html vers les nouvelles URLs
# sans extension. Le worker émet un 301 PERMANENT à la place.
run_worker_first = ["/*.html"]
